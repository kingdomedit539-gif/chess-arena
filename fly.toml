# ---------------------------------------------------------------------------
# Fly.io — single machine, WebSocket friendly.
#
#   fly launch --no-deploy      # creates the app, keeps this file
#   fly deploy
#   fly open
#
# `min_machines_running = 1` keeps the instance warm so Socket.io matchmaking
# is instant. Set PUBLIC_URL to https://<app>.fly.dev for invite links.
# ---------------------------------------------------------------------------

app = "chess-arena"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  RECONNECT_GRACE_MS = "30000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
